<!--
  A banner rather than a modal: the game is already unplayable once it is over (the service
  ignores plays and the add buttons disable), so nothing needs blocking — and this keeps the
  winning line in view while the players decide what to do next.
-->
<section class="banner" role="status" aria-live="polite" animate.enter="arriving">
  <div class="result">
    @if (winner(); as player) {
      <span class="marker" [style.background-color]="player.color"></span>
      <p class="headline display">{{ player.name }} wins</p>
      <p class="detail">Four in a row.</p>
    } @else {
      <p class="headline display">It's a draw</p>
      <p class="detail">Every slot is full and nobody got four in a row.</p>
    }
  </div>

  <div class="actions">
    <button class="action primary display" type="button" (click)="restart.emit()">
      Play again
    </button>
    <button class="action display" type="button" (click)="changePlayers.emit()">
      Change players
    </button>
  </div>
</section>
