<div class="card" [class.has-turn]="hasTurn()">
  <p class="name display">{{ player().name }}</p>

  <div class="disk-container">
    @for (disk of disks(); track $index) {
      <app-disk [disk]="disk"></app-disk>
    }
  </div>

  <p class="remaining">
    <span class="count display">{{ remainingDisks() }}</span>
    <span class="count-label">disks left</span>
  </p>
</div>
