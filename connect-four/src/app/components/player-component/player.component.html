<div class="card" [class.has-turn]="hasTurn()">
  <div class="card2">
    <div class="player-container">
      <p class="player-text player-name">{{ player().name }}</p>

      <div class="disk-container">
        @for (disk of disks(); track $index) {
          <app-disk [disk]="disk"></app-disk>
        }
      </div>

      <p class="player-text remaining">Remaining Disks: {{ remainingDisks() }}</p>
      <p class="turn" [class.visible]="hasTurn()">Your turn</p>
    </div>
  </div>
</div>
