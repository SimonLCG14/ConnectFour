<div class="field-column">
  @for (slot of slots(); track slot.row; let index = $index) {
    <div class="slot">
      <span class="hole"></span>

      @if (slot.field !== Field.NONE) {
        <!-- The disk enters the DOM as it is played, which is what drives the drop animation. -->
        <app-disk
          class="disk"
          animate.enter="dropping"
          [style.--fall-slots]="index + 1"
          [class.winning]="slot.winning"
          [disk]="{ color: colorFor(slot.field) }"
        ></app-disk>
      }
    </div>
  }
</div>
