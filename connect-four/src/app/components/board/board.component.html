<div class="board-grid">
  @for (column of columns(); track $index; let columnIndex = $index) {
    <div class="container">
      <app-add-button
        class="button"
        [column]="columnIndex"
        [disabled]="!isColumnPlayable(columnIndex)"
        [label]="'Drop a disk in column ' + (columnIndex + 1)"
        (dropped)="game.play($event)"
      ></app-add-button>

      <app-field-column class="column" [slots]="column" [colors]="colors()"></app-field-column>
    </div>
  }
</div>
